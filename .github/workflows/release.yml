name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2 Clang64 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            ninja
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-libxxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-tsl-robin-map
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang

      - name: Compile Native PC Engine (sacredfire -> basara_pc.exe)
        shell: msys2 {0}
        run: |
          ./win_build.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build Desktop Launcher (Basara4_Launcher.exe)
        run: |
          python build_launcher.py

      - name: Setup Inno Setup Compiler
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Compile Inno Setup Installer
        shell: cmd
        run: |
          if exist "C:\Program Files (x86)\Inno Setup 6\iscc.exe" (
            "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DAppVersion=${{ github.ref_name }} packaging\windows\installer.iss
          ) else (
            echo Inno Setup not available, skipping setup installer executable.
          )

      - name: Package Distribution Archive (ZIP + Checksums)
        run: |
          python scripts/package_release.py --version ${{ github.ref_name }}

      - name: Verify Release Artifacts Integrity
        run: |
          python scripts/verify_release.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.exe
            CHECKSUMS.txt
            VERSION.txt
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
